<!-- JAVASCRIPT CONTROLLERS FOR CLIENT DIARIES MODAL           -->
<!-- ========================================================= -->
<script>
function openClientDiariesModal() {
  const modal = document.getElementById('client-diaries-modal');
  const card  = document.getElementById('cd-modal-card');
  if(!modal || !card) return;

  modal.classList.remove('hidden');
  modal.classList.add('flex');
  setTimeout(() => {
    card.classList.remove('scale-95', 'opacity-0');
    card.classList.add('scale-100', 'opacity-100');
  }, 10);
}

function closeClientDiariesModal() {
  const modal = document.getElementById('client-diaries-modal');
  const card  = document.getElementById('cd-modal-card');
  if(!modal || !card) return;

  card.classList.remove('scale-100', 'opacity-100');
  card.classList.add('scale-95', 'opacity-0');
  setTimeout(() => {
    modal.classList.remove('flex');
    modal.classList.add('hidden');
  }, 250);
}

window.addEventListener('click', (e) => {
  const modal = document.getElementById('client-diaries-modal');
  if(e.target === modal) closeClientDiariesModal();
});
</script>
