<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate & Executive Suiting | TOOFIT Suit Atelier</title>
  <meta name="description" content="Discover TOOFIT Corporate Collection — Executive business suits, spread collar shirting, pure silk neckties, pocket squares, and doorstep C-suite tailoring.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,300;0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mpfNavy: '#0A192F',
            mpfDarkSlate: '#0F172A',
            mpfGold: '#C59B27',
            mpfBg: '#FFFFFF',
          },
          fontFamily: {
            sans: ['"Montserrat"', '"Inter"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', '"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    #toofit-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
    }
    .tf-brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tf-standalone-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }
    .tf-brand-center {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tf-brand-row-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .tf-toofit-column {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
    }
    .tf-brand-name-link { text-decoration: none; }
    .tf-brand-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: #0F172A;
    }
    .tf-brand-caption {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: #C59B27;
      margin-top: 2px;
    }
    .tf-faded-vdivider {
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, transparent, #CBD5E1, transparent);
    }
    .tf-since-column { display: flex; align-items: center; }
    .tf-since-text {
      font-family: 'Newsreader', serif;
      font-size: 0.88rem;
      font-style: italic;
      color: #64748B;
    }
    .tf-since-year { font-weight: 600; color: #0F172A; font-style: normal; }
    .tf-nav-right { display: flex; align-items: center; gap: 16px; }
    .tf-liquid-btn {
      display: inline-block;
      padding: 10px 22px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: #0F172A;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .tf-liquid-btn:hover {
      background: #C59B27;
      box-shadow: 0 4px 14px rgba(197, 155, 39, 0.35);
    }
    .tf-nav-row { padding: 10px 0; border-top: 1px solid #F1F5F9; }
    .tf-nav-links { list-style: none; margin: 0; padding: 0; }
    .tf-nav-links a {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #475569;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .tf-nav-links a:hover,
    .tf-nav-links a.active { color: #C59B27; }
    .tf-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
    }
    .tf-hamburger span { width: 24px; height: 2px; background-color: #0F172A; }
    @media (max-width: 768px) {
      .tf-hamburger { display: flex; }
      .desktop-only { display: none; }
      .tf-nav-row { display: none; }
    }
    .tf-mobile-drawer {
      display: none;
      flex-direction: column;
      background: #FFFFFF;
      padding: 16px 24px;
      border-top: 1px solid #E2E8F0;
    }
    .tf-mobile-drawer.open { display: flex; }
    .tf-mobile-drawer a {
      padding: 12px 0;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0F172A;
      text-decoration: none;
      border-bottom: 1px solid #F1F5F9;
    }
  </style>
</head>

<body class="bg-[#FAF8F5] text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- LUXURY NAVBAR -->
  <nav id="toofit-nav" aria-label="Main Navigation">
    <div class="tf-brand-header">
      <div class="tf-logo-container">
        <a href="index.html" class="tf-logo-link" title="TOOFIT Bespoke Atelier">
          <img src="assets/official_toofit_logo_dark.png" alt="TOOFIT Official Logo" class="tf-standalone-logo-img">
        </a>
      </div>
      <div class="tf-brand-center">
        <div class="tf-brand-row-wrapper">
          <div class="tf-toofit-column">
            <a href="index.html" class="tf-brand-name-link">
              <span class="tf-brand-name">TOOFIT</span>
            </a>
            <div class="tf-brand-caption">SUIT ATELIER</div>
          </div>
          <span class="tf-faded-vdivider"></span>
          <div class="tf-since-column">
            <span class="tf-since-text">since <span class="tf-since-year">1969</span></span>
          </div>
        </div>
      </div>
      <div class="tf-nav-right">
        <a href="index.html#booking" class="tf-liquid-btn desktop-only">
          <span>Book Consultant</span>
        </a>
        <button class="tf-hamburger" id="tf-hamburger" aria-label="Toggle Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="tf-nav-row flex justify-center items-center w-full text-center">
      <ul class="tf-nav-links flex items-center justify-center gap-12 sm:gap-20 md:gap-24 lg:gap-28 mx-auto text-center">
        <li><a href="index.html#story">Our Story</a></li>
        <li><a href="bespoke.html">Bespoke</a></li>
        <li><a href="wedding.html">Wedding</a></li>
        <li><a href="corporate.html" class="active text-[#C59B27] border-b-2 border-[#C59B27] pb-1">Corporate</a></li>
      </ul>
    </div>
    <div class="tf-mobile-drawer" id="tf-mobile-drawer">
      <a href="index.html#story">Our Story</a>
      <a href="bespoke.html">Bespoke</a>
      <a href="wedding.html">Wedding</a>
      <a href="corporate.html" class="text-[#C59B27]">Corporate</a>
      <a href="index.html#booking" class="tf-liquid-btn text-center mt-4">
        <span>Book Consultant</span>
      </a>
    </div>
  </nav>

  <!-- ============================================ -->
  <!-- HERO HEADER — CORPORATE PAGE                 -->
  <!-- ============================================ -->
  <main class="flex-grow">
    <section class="relative bg-[#0A192F] text-white py-28 sm:py-36 px-6 md:px-12 text-left overflow-hidden flex items-center min-h-[480px] sm:min-h-[540px]">
      <!-- High-resolution corporate executive background image provided by user -->
      <div class="absolute inset-0 bg-cover bg-center filter brightness-[0.80] transition-transform duration-1000 scale-105"
        style="background-image: url('assets/hero_corporate_user_executive.png'); background-position: right center;"></div>
      <div class="absolute inset-0 bg-gradient-to-r from-[#0A192F] via-[#0A192F]/85 to-transparent"></div>
      
      <div class="relative z-10 max-w-2xl mx-0 sm:ml-12 space-y-4">
        <div class="flex items-center gap-2">
          <span class="w-8 h-px bg-[#C59B27]"></span>
          <span class="text-[#C59B27] text-xs sm:text-sm font-semibold tracking-[0.35em] uppercase">C-SUITE SUITING & POWER DRESSING</span>
        </div>
        <h1 class="text-3xl sm:text-5xl md:text-6xl font-serif font-light text-white tracking-wide leading-tight drop-shadow-lg">
          The Architecture of Executive Elegance
        </h1>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-6 px-6 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <span>TOOFIT Suit Atelier &bull; Since 1969</span>
      <span>&copy; 2026 TOOFIT. All rights reserved.</span>
    </div>
  </footer>

  <script>
    document.getElementById('tf-hamburger').addEventListener('click', function () {
      document.getElementById('tf-mobile-drawer').classList.toggle('open');
    });
  </script>
</body>
</html>
